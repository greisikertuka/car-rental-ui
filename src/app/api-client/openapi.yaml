    UserNotification:
      required:
      - notificationType
      - title
      - message
      - read
      - userId
      - objectId
      - createdAt
      type: object
      properties:
        id:
          format: int64
          type: integer
        notificationType:
          $ref: '#/components/schemas/NotificationType'
        title:
          type: string
        message:
          type: string
        read:
          type: boolean
        userId:
          format: int32
          type: integer
        objectId:
          format: int32
          type: integer
        createdAt:
          $ref: '#/components/schemas/ZonedDateTime'
    ZonedDateTime:
      format: date-time
      type: string
      example: 2022-03-10T12:15:50-04:00
  securitySchemes:
    SecurityScheme:
      type: http
      description: Authentication
      scheme: bearer
